# ---------------------------------------------------------------------------
# Configuracion del bot. Cada clave se valida contra bot/config/schema.py:
# una clave desconocida o fuera de rango aborta el arranque.
#
# Se admite ${VAR} y ${VAR:-valor_por_defecto} para leer variables de entorno.
# Nunca escribas claves de API aqui: se leen del entorno por nombre.
# ---------------------------------------------------------------------------

exchange:
  name: binance
  testnet: true
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET
  recv_window_ms: 5000
  quote_asset: USDT

data:
  cache_dir: var/cache
  timeframe: 15m
  warmup_bars: 400
  max_bars_per_request: 1000
  symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT

indicators:
  ema_fast: 20
  ema_slow: 50
  ema_trend: 200
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  atr_period: 14
  relative_volume_lookback: 20
  sr_lookback: 120
  sr_pivot_window: 3
  sr_tolerance_pct: 0.4

# Filtros obligatorios: si uno falla no se puntua, se registra el rechazo.
gates:
  enabled: true
  require_trend_alignment: true
  allow_short: false
  min_relative_volume: 1.2
  rsi_long_max: 72.0
  rsi_short_min: 28.0
  min_atr_pct: 0.3
  max_atr_pct: 8.0
  max_spread_pct: 0.15
  min_quote_volume: 2000000.0
  min_bars_available: 250
  blacklist: []

# Puntuacion sobre 100. Los pesos se normalizan, no hace falta que sumen 100.
scoring:
  min_score: 60.0
  weights:
    trend: 25.0
    momentum: 20.0
    rsi: 15.0
    volume: 15.0
    structure: 15.0
    volatility: 10.0

risk:
  risk_per_trade_pct: 0.75
  max_position_pct: 20.0
  max_concurrent_positions: 3
  max_exposure_pct: 60.0
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 7.0
  max_daily_trades: 8
  cooldown_minutes_after_loss: 60
  cooldown_minutes_same_symbol: 120
  max_correlation: 0.85
  correlation_lookback: 120
  stop_atr_multiple: 1.8
  take_profit_r_multiple: 2.2
  kill_switch:
    enabled: true
    consecutive_losses: 4
    max_drawdown_pct: 15.0
    max_errors_per_hour: 10

execution:
  mode: paper
  order_type: market
  limit_offset_bps: 5.0
  slippage_bps: 4.0
  fee_bps: 7.5
  poll_seconds: 30
  # Operar con dinero real exige poner aqui, literalmente: I-UNDERSTAND-THE-RISK
  live_confirmation: ""

backtesting:
  start: 2023-01-01
  end: 2024-12-31
  initial_balance: 10000.0
  benchmark_symbol: BTCUSDT
  walk_forward:
    enabled: true
    train_days: 90
    test_days: 30
    step_days: 30
  monte_carlo:
    enabled: true
    iterations: 1000
    seed: 7

logging:
  db_path: var/bot.sqlite
  level: INFO
  log_rejections: true
  console: true
